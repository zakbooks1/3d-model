<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PolyCraft Studio - Browser 3D Suite</title>
    <style>
        :root {
            --bg-dark: #121212;
            --panel-bg: rgba(28, 28, 30, 0.85);
            --accent: #ff4757; /* Blender-ish orange-red accent */
            --accent-hover: #ff6b81;
            --text-main: #f1f2f6;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* UI Layout Panes */
        .panel {
            position: absolute;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 10;
        }

        #toolbar-left {
            top: 15px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 190px;
        }

        #toolbar-top {
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
        }

        h1 {
            font-size: 13px;
            margin: 0 0 6px 0;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-label {
            font-size: 10px;
            color: #888;
            margin: 6px 0 2px 0;
            text-transform: uppercase;
        }

        .btn-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        button {
            background: #2f3542;
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.15s ease;
            flex: 1;
            min-width: 50px;
        }

        button:hover {
            background: #404040;
            border-color: rgba(255,255,255,0.2);
        }

        button.active {
            background: var(--accent);
            color: white;
            font-weight: 600;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 26px;
            border-radius: 6px;
            cursor: pointer;
            background: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 1px solid var(--border); border-radius: 6px; }

        .slider-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10px;
            color: #aaa;
            margin-top: 4px;
        }
        input[type="range"] {
            width: 65%;
            accent-color: var(--accent);
        }

        #status-bar {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 10px;
            color: #aaa;
            pointer-events: none;
            border: 1px solid var(--border);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Left Toolbar: Primitive Creation & Modifications -->
    <div id="toolbar" class="panel" style="top:15px; left:15px; width:200px;">
        <h1>PolyCraft Studio</h1>
        
        <div class="section-label">Add Primitive</div>
        <div class="btn-group">
            <button onclick="addShape('box')">Cube</button>
            <button onclick="addShape('sphere')">Sphere</button>
        </div>
        <div class="btn-group">
            <button onclick="addShape('cylinder')">Cylinder</button>
            <button onclick="addShape('torus')">Torus</button>
        </div>

        <div class="section-label">Transform Tools</div>
        <div class="btn-group">
            <button id="btn-select" class="active" onclick="setMode('select')">Select</button>
            <button id="btn-rotate" onclick="setMode('rotate')">Rotate</button>
        </div>
        <div class="btn-group">
            <button onclick="scaleSelected(1.2)">Scale+</button>
            <button onclick="scaleSelected(0.8)">Scale-</button>
        </div>

        <div class="section-label">Blender-Style Actions</div>
        <div class="btn-group">
            <button onclick="extrudeSelected()" style="background:#e1b12c; color:#000;">Extrude</button>
            <button onclick="duplicateSelected()">Duplicate</button>
        </div>
        <div class="btn-group">
            <button onclick="toggleWireframe()">Wireframe</button>
            <button onclick="deleteSelected()" style="background:#c23616;">Delete</button>
        </div>

        <div class="section-label">Material Color</div>
        <input type="color" id="colorPicker" value="#ff4757" onchange="changeColor(this.value)">

        <div class="section-label">File Export</div>
        <div class="btn-group">
            <button onclick="exportFile('obj')">OBJ</button>
            <button onclick="exportFile('stl')">STL</button>
        </div>
    </div>

    <!-- Top Toolbar: Scene View Modes -->
    <div id="toolbar-top" class="panel">
        <button id="btn-grid" class="active" onclick="toggleGrid()">Grid: On</button>
        <button onclick="resetCamera()">Reset View</button>
    </div>

    <div id="status-bar">
        <b>Controls:</b> One finger/Click to Orbit | Tap/Click object to Select | Use tools to modify mesh.
    </div>

    <div id="canvas-container"></div>

    <!-- Three.js + Exporters Ecosystem -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/OBJExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let objects = [];
        let selectedObject = null;
        let mode = 'select'; // 'select', 'rotate'
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let gridHelper;
        let isGridVisible = true;

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x121212);
            scene.fog = new THREE.FogExp2(0x121212, 0.025);

            // Camera setup
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(7, 7, 10);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Orbit Controls (Fully optimized for iPad touch gestures & PC mouse)
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Studio Lighting Setup (Blender-like 3-point illumination)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const keyLight = new THREE.DirectionalLight(0xffffff, 0.8);
            keyLight.position.set(10, 20, 15);
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0x70a1ff, 0.3);
            fillLight.position.set(-10, -10, -10);
            scene.add(fillLight);

            // Ground Floor Grid
            gridHelper = new THREE.GridHelper(20, 20, 0xff4757, 0x333333);
            gridHelper.position.y = -1;
            scene.add(gridHelper);

            // Seed initial mesh
            addShape('box');

            // Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointerdown', onPointerDown, false);
            document.body.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
        }

        function addShape(type) {
            let geometry;
            switch(type) {
                case 'box': geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5); break;
                case 'sphere': geometry = new THREE.SphereGeometry(1, 32, 32); break;
                case 'cylinder': geometry = new THREE.CylinderGeometry(0.8, 0.8, 2, 32); break;
                case 'torus': geometry = new THREE.TorusGeometry(1, 0.3, 16, 48); break;
            }

            const material = new THREE.MeshStandardMaterial({ 
                color: document.getElementById('colorPicker').value,
                roughness: 0.25,
                metalness: 0.1
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(0, 0, 0);
            scene.add(mesh);
            objects.push(mesh);
            selectObject(mesh);
        }

        function duplicateSelected() {
            if (!selectedObject) return;
            const cloneGeo = selectedObject.geometry.clone();
            const cloneMat = selectedObject.material.clone();
            const cloneMesh = new THREE.Mesh(cloneGeo, cloneMat);
            
            cloneMesh.position.copy(selectedObject.position).add(new THREE.Vector3(0.5, 0, 0.5));
            cloneMesh.rotation.copy(selectedObject.rotation);
            cloneMesh.scale.copy(selectedObject.scale);

            scene.add(cloneMesh);
            objects.push(cloneMesh);
            selectObject(cloneMesh);
        }

        // Simulates an Extrude operation (scales out geometry vertices / increases height profile)
        function extrudeSelected() {
            if (!selectedObject) return;
            // Quick modifier scaling effect mimicking an extrusion profile pull
            selectedObject.scale.x *= 1.25;
            selectedObject.scale.z *= 1.25;
            selectedObject.scale.y *= 1.25;
        }

        function toggleWireframe() {
            if (selectedObject) {
                selectedObject.material.wireframe = !selectedObject.material.wireframe;
            }
        }

        function setMode(newMode) {
            mode = newMode;
            document.getElementById('btn-select').classList.remove('active');
            document.getElementById('btn-rotate').classList.remove('active');
            document.getElementById(`btn-${newMode}`).classList.add('active');

            // Disable background orbit when manually rotating object vertices/transforms
            controls.enabled = (mode !== 'rotate');
        }

        let isDraggingObject = false;
        let prevMouse = { x: 0, y: 0 };

        function onPointerDown(event) {
            // Ignore UI clicks
            if (event.target.closest('.panel')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects);

            if (intersects.length > 0) {
                selectObject(intersects[0].object);
                if (mode === 'rotate') {
                    isDraggingObject = true;
                    prevMouse = { x: event.clientX, y: event.clientY };
                }
            } else {
                isDraggingObject = false;
            }
        }

        window.addEventListener('pointermove', (event) => {
            if (isDraggingObject && selectedObject && mode === 'rotate') {
                const dx = event.clientX - prevMouse.x;
                const dy = event.clientY - prevMouse.y;
                selectedObject.rotation.y += dx * 0.01;
                selectedObject.rotation.x += dy * 0.01;
                prevMouse = { x: event.clientX, y: event.clientY };
            }
        });

        window.addEventListener('pointerup', () => { isDraggingObject = false; });

        function selectObject(mesh) {
            objects.forEach(obj => {
                if (obj.material.emissive) obj.material.emissive.setHex(0x000000);
            });
            selectedObject = mesh;
            if (selectedObject.material.emissive) {
                selectedObject.material.emissive.setHex(0x222222);
            }
            document.getElementById('colorPicker').value = '#' + selectedObject.material.color.getHexString();
        }

        function changeColor(hex) {
            if (selectedObject) selectedObject.material.color.set(hex);
        }

        function scaleSelected(factor) {
            if (selectedObject) selectedObject.scale.multiplyScalar(factor);
        }

        function deleteSelected() {
            if (!selectedObject) return;
            scene.remove(selectedObject);
            objects = objects.filter(o => o !== selectedObject);
            selectedObject.geometry.dispose();
            selectedObject.material.dispose();
            selectedObject = null;
        }

        function toggleGrid() {
            isGridVisible = !isGridVisible;
            gridHelper.visible = isGridVisible;
            const btn = document.getElementById('btn-grid');
            btn.innerText = `Grid: ${isGridVisible ? 'On' : 'Off'}`;
            btn.classList.toggle('active', isGridVisible);
        }

        function resetCamera() {
            camera.position.set(7, 7, 10);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        function exportFile(format) {
            if (objects.length === 0) {
                alert("Scene is empty!");
                return;
            }
            let output, filename, mimeType;

            if (format === 'obj') {
                const exporter = new THREE.OBJExporter();
                output = exporter.parse(scene);
                filename = 'polycraft_model.obj';
                mimeType = 'text/plain';
            } else {
                const exporter = new THREE.STLExporter();
                output = exporter.parse(scene);
                filename = 'polycraft_model.stl';
                mimeType = 'application/octet-stream';
            }

            const blob = new Blob([output], { type: mimeType });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
